[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itgc-evidence-automation"
version = "0.1.0"
description = "Automates SOX ITGC evidence collection and CAP generation for access and change management controls"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Mihir Ajmera", email = "ajmera.mihir.79@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "flake8>=6.0",
    "bandit>=1.7",
    "black>=23.0",
    "boto3>=1.34",
]

[project.scripts]
itgc-evidence-automation = "cli:main"

[tool.setuptools]
packages = ["evidence_automation"]
py-modules = ["cli"]
